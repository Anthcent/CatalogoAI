services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - "5432:5432"
    volumes:
      - catalogo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalogo_postgres:
